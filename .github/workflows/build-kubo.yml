name: Build and Push Kubo

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'stack-orchestrator/container-build/cerc-dumpster-kubo/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gorbagana-dev/dumpster-kubo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kubo image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f stack-orchestrator/container-build/cerc-dumpster-kubo/Dockerfile \
            stack-orchestrator/container-build/cerc-dumpster-kubo

      - name: Push to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Notify deploy webhook
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}/deploy/notify" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\", \"service\": \"dumpster-kubo\"}"
