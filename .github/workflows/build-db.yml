name: Build and Push DB

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'stack-orchestrator/container-build/gorbagana-dev-dumpster-db/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gorbagana-dev/dumpster-db

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build db image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f stack-orchestrator/container-build/gorbagana-dev-dumpster-db/Dockerfile \
            stack-orchestrator/container-build/gorbagana-dev-dumpster-db

      - name: Push to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
