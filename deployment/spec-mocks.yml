# Mock external services for local dumpster testing.
# Deploys MinIO (S3-compatible) with TLS as a replacement for Cloudflare R2.
# Deploy BEFORE the dumpster stack — laconic-so's external-services creates
# a headless Service that routes the dumpster pod's s3:443 to this MinIO.
stack: stack-orchestrator/stacks/dumpster-mocks
deploy-to: k8s-kind
namespace: laconic-dumpster-mocks
network:
  ports:
    dumpster-minio:
      - '443'
      - '9001'
# mkcert cert for hostname "s3" — MinIO presents this for TLS.
# Generated by setup_local_env.yml, stored at ~/.credentials/local-certs/s3/
configmaps:
  minio-certs: ~/.credentials/local-certs/s3
config:
  MINIO_ROOT_USER: dumpsterlocaldev2026minioadmkeys
  MINIO_ROOT_PASSWORD: dumpsterlocaldev2026minioadmkeys
