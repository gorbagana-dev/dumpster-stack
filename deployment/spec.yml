# Dumpster Launchpad deployment spec - GitOps managed
# This file is the source of truth for deployment configuration
# Edit and commit to update the deployment
stack: stack-orchestrator/stacks/dumpster
deploy-to: k8s-kind
network:
  http-proxy:
    - host-name: dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-frontend:3000
    - host-name: api.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-backend:3200
        - path: /ws
          proxy-to: dumpster-backend:3200
          websocket: true
    - host-name: docs.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-docs:3100
    - host-name: media.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-kubo:8080
  ports:
    dumpster-db:
      - '5432'
    dumpster-redis:
      - '6379'
    dumpster-kubo:
      - '5001'
      - '8080'
    dumpster-backend:
      - '3200'
    dumpster-frontend:
      - '3000'
    dumpster-docs:
      - '3100'
volumes:
  dumpster-db-data: ./data/dumpster-db
  dumpster-redis-data: ./data/dumpster-redis
  dumpster-ipfs-data: ./data/dumpster-ipfs

config:
  # Blockchain - injected by ansible from live cluster state
  # Placeholder values here; ansible resolves the actual service name at deploy time
  RPC_URL: ANSIBLE_INJECT
  WS_RPC_URL: ANSIBLE_INJECT

  # Database (internal - all containers in same pod, use localhost)
  # Password is shared between postgres container and DATABASE_URL.
  # Not security-sensitive: DB only accessible within the pod.
  DB_USER: dumpster
  DB_NAME: dumpster
  DB_PASSWORD: dumpster-internal
  DATABASE_URL: postgresql://dumpster:dumpster-internal@localhost:5432/dumpster
  REDIS_URL: redis://localhost:6379

  # Auth & encryption
  JWT_SECRET: $generate:hex:32$
  ENCRYPTION_KEY: $generate:hex:32$

  # IPFS (internal kubo - same pod)
  IPFS_API_URL: http://localhost:5001
  IPFS_GATEWAY_URL: https://media.dumpster.cash

  # Cloudflare R2 - credentials loaded from ~/.credentials/dumpster-r2.env on woodburn
  R2_BUCKET: dumpster-uploads
  R2_PUBLIC_BASE_URL: https://uploads.dumpster.cash

  # Frontend NEXT_PUBLIC_* vars are baked at build time in Dockerfile.base

  # Backend
  CORS_ORIGIN: https://dumpster.cash
  METADATA_FETCH_ALLOWLIST: uploads.dumpster.cash,media.dumpster.cash
  RUN_MIGRATIONS: 'true'

  # Optional - uncomment and fill when ready
  # ADMIN_WALLETS: ''
  # MIGRATION_KEYPAIR: ''
  # SENTRY_DSN: ''
