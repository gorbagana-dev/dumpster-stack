# Dumpster Launchpad deployment spec - GitOps managed
# This file is the source of truth for deployment configuration
# Edit and commit to update the deployment
stack: stack-orchestrator/stacks/dumpster
deploy-to: k8s-kind
network:
  http-proxy:
    - host-name: dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-frontend:3000
    - host-name: api.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-backend:3200
        - path: /ws
          proxy-to: dumpster-backend:3200
          websocket: true
    - host-name: docs.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-docs:3100
    - host-name: media.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-kubo:8080
  ports:
    dumpster-db:
      - '5432'
    dumpster-redis:
      - '6379'
    dumpster-kubo:
      - '5001'
      - '8080'
    dumpster-backend:
      - '3200'
    dumpster-frontend:
      - '3000'
    dumpster-docs:
      - '3100'
volumes:
  # Host-path mounts require Kind extraMounts (cluster recreation).
  # Using empty paths for now — data persists in local-path-provisioner
  # inside the Kind container but is lost on cluster deletion.
  # TODO: add host paths after cluster recreation (see plan)
  dumpster-db-data:
  dumpster-redis-data:
  dumpster-ipfs-data:

config:
  # Database (internal - all containers in same pod, laconic-so rewrites to localhost)
  DB_USER: dumpster
  DB_NAME: dumpster
  DB_PASSWORD: dumpster-internal
  DATABASE_URL: postgresql://dumpster:dumpster-internal@dumpster-db:5432/dumpster
  REDIS_URL: redis://dumpster-redis:6379

  # IPFS (internal kubo - same pod, laconic-so rewrites to localhost)
  IPFS_API_URL: http://dumpster-kubo:5001
  IPFS_GATEWAY_URL: https://media.dumpster.cash

  # Non-secret config that lives in the spec
  R2_BUCKET: dumpster-uploads
  R2_PUBLIC_BASE_URL: https://uploads.dumpster.cash
  CORS_ORIGIN: https://dumpster.cash
  METADATA_FETCH_ALLOWLIST: uploads.dumpster.cash,media.dumpster.cash
  RUN_MIGRATIONS: 'true'

  # Injected by ansible at deploy time (not in spec):
  #   RPC_URL, WS_RPC_URL — from dumpster-rpc.env (resolved from live cluster)
  #   R2_ACCESS_KEY, R2_SECRET_KEY, R2_ACCOUNT_ID, R2_ENDPOINT — from dumpster-r2.env
  #   JWT_SECRET, ENCRYPTION_KEY — from dumpster-secrets.env (generated once)
