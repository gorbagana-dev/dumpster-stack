# Dumpster Launchpad deployment spec - GitOps managed
# This file is the source of truth for deployment configuration
# Edit and commit to update the deployment
stack: stack-orchestrator/stacks/dumpster
deploy-to: k8s-kind
namespace: laconic-dumpster
network:
  http-proxy:
    - host-name: dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-frontend:3000
    - host-name: api.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-backend:3200
        - path: /ws
          proxy-to: dumpster-backend:3200
          websocket: true
    - host-name: docs.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-docs:3100
    - host-name: media.dumpster.cash
      routes:
        - path: /
          proxy-to: dumpster-kubo:8080
  ports:
    dumpster-db:
      - '5432'
    dumpster-redis:
      - '6379'
    dumpster-kubo:
      - '5001'
      - '8080'
    dumpster-backend:
      - '3200'
    dumpster-frontend:
      - '3000'
    dumpster-docs:
      - '3100'
# Maintenance page served during deployment restarts (Recreate strategy).
# The maintenance pod uses RollingUpdate and stays up while main pods restart.
maintenance-service: dumpster-maintenance:8000
# Pull latest images from GHCR on every restart (Kind defaults to IfNotPresent)
image-pull-policy: Always
# Registry authentication for private GHCR images
image-pull-secret:
  server: ghcr.io
  username: gorbagana-dev
  token-file: ~/.credentials/ghcr_token
# External service routing — laconic-so creates k8s Services for these.
# In production: ExternalName (DNS CNAME to provider).
# In testing: headless Service + Endpoints (routes to mock pod).
external-services:
  s3:
    host: 52c20c98f552c6af17369284bd9a78b2.r2.cloudflarestorage.com
    port: 443
credentials-files:
  - ~/.credentials/dumpster-secrets.env
  - ~/.credentials/dumpster-r2.env
  - ~/.credentials/dumpster-ipfs-r2.env
  - ~/.credentials/dumpster-rpc.env
  - ~/.credentials/dumpster-pg-backups-r2.env

configmaps:
  # Maintenance page HTML served by caddy during restarts
  maintenance-html: stack-orchestrator/compose/maintenance

# Single Kind extraMount: /srv/kind → /mnt. All volumes under this root
# persist on the ZFS dataset (woodburn/DATA/srv/kind) and survive cluster
# deletion. New volumes can be added without cluster recreation.
kind-mount-root: /srv/kind
volumes:
  dumpster-db-data: /srv/kind/dumpster/db
  dumpster-redis-data: /srv/kind/dumpster/redis

config:
  # Database (all containers share localhost in laconic-so's single-pod model)
  DB_USER: dumpster
  DB_NAME: dumpster
  DB_PASSWORD: dumpster-internal
  DATABASE_URL: postgresql://dumpster:dumpster-internal@localhost:5432/dumpster
  REDIS_URL: redis://localhost:6379

  # IPFS (kubo in same pod)
  IPFS_API_URL: http://localhost:5001
  IPFS_GATEWAY_URL: https://media.dumpster.cash

  # S3/R2 — endpoint routes via external-services k8s Service
  R2_ENDPOINT: https://s3:443
  R2_BUCKET: dumpster-uploads
  R2_IPFS_BUCKET: dumpster-ipfs
  R2_PUBLIC_BASE_URL: https://uploads.dumpster.cash
  CORS_ORIGIN: https://dumpster.cash
  METADATA_FETCH_ALLOWLIST: uploads.dumpster.cash,media.dumpster.cash
  RUN_MIGRATIONS: 'true'
