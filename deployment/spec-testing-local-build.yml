# Dumpster Launchpad LOCAL-BUILD deployment spec
# Mirrors spec-testing.yml (mocks + .local hostnames) but routes every
# buildable container to its locally-built `:local` tag instead of
# pulling from GHCR. Required workflow before `deployment start`:
#   1. laconic-so --stack <stack> build-containers
#   2. kind load docker-image gorbagana-dev/<svc>:local --name <cluster>
#      for each of: db, frontend, backend, kubo, docs
# Without those prerequisites, pods crash with ImagePullBackOff because
# the `:local` tags don't exist in any registry.
stack: stack-orchestrator/stacks/dumpster
deploy-to: k8s-kind
namespace: laconic-dumpster
network:
  http-proxy:
    - host-name: dumpster.local
      routes:
        - path: /
          proxy-to: dumpster-frontend:3000
    - host-name: api.dumpster.local
      routes:
        - path: /
          proxy-to: dumpster-backend:3200
        - path: /ws
          proxy-to: dumpster-backend:3200
          websocket: true
    - host-name: docs.dumpster.local
      routes:
        - path: /
          proxy-to: dumpster-docs:3100
    - host-name: media.dumpster.local
      routes:
        - path: /
          proxy-to: dumpster-kubo:8080
  ports:
    dumpster-db:
      - '5432'
    dumpster-redis:
      - '6379'
    dumpster-kubo:
      - '5001'
      - '8080'
    dumpster-backend:
      - '3200'
    dumpster-frontend:
      - '3000'
    dumpster-docs:
      - '3100'
maintenance-service: dumpster-maintenance:8000
# External services route to mock pods instead of real providers.
# The s3 Service resolves to the MinIO pod in the mocks namespace.
external-services:
  s3:
    selector:
      app.kubernetes.io/stack: dumpster-mocks
    namespace: laconic-dumpster-mocks
    port: 443
# Trust mkcert root CA so containers accept MinIO's TLS cert.
ca-certificates:
  - ~/.local/share/mkcert/rootCA.pem
# image-pull-secret intentionally omitted — locally-built `:local` tags
# are loaded into kind via `kind load docker-image` and never pulled.
credentials-files:
  - ~/.credentials/dumpster-local-secrets.env
  - ~/.credentials/dumpster-local-r2.env
  - ~/.credentials/dumpster-local-rpc.env

configmaps:
  maintenance-html: stack-orchestrator/compose/maintenance

kind-mount-root: /srv/kind
volumes:
  dumpster-db-data: /srv/kind/dumpster-local/db
  dumpster-redis-data: /srv/kind/dumpster-local/redis

# Override SO's DEFAULT_CONTAINER_RESOURCES (1 CPU / 2000M per container).
# At the default, the 6-container dumpster pod alone asks for 12G of memory
# requests, which does not fit on a dev laptop. Values below are tuned for
# idle/light local dev workloads, not production throughput.
resources:
  containers:
    dumpster-db:
      reservations:
        cpus: "0.1"
        memory: 256M
      limits:
        cpus: "1.0"
        memory: 1G
    dumpster-redis:
      reservations:
        cpus: "0.05"
        memory: 128M
      limits:
        cpus: "0.5"
        memory: 512M
    dumpster-kubo:
      reservations:
        cpus: "0.1"
        memory: 384M
      limits:
        cpus: "1.0"
        memory: 1G
    dumpster-backend:
      reservations:
        cpus: "0.2"
        memory: 512M
      limits:
        cpus: "1.5"
        memory: 1500M
    dumpster-frontend:
      reservations:
        cpus: "0.2"
        memory: 768M
      limits:
        cpus: "1.5"
        memory: 2G
    dumpster-docs:
      reservations:
        cpus: "0.05"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
    dumpster-maintenance:
      reservations:
        cpus: "0.05"
        memory: 64M
      limits:
        cpus: "0.5"
        memory: 256M

config:
  DB_USER: dumpster
  DB_NAME: dumpster
  DB_PASSWORD: dumpster-local
  DATABASE_URL: postgresql://dumpster:dumpster-local@localhost:5432/dumpster
  REDIS_URL: redis://localhost:6379
  IPFS_API_URL: http://localhost:5001
  IPFS_GATEWAY_URL: https://media.dumpster.local
  # S3 — same endpoint URL as production. external-services routes
  # to MinIO. Region must be us-east-1 for MinIO (R2 uses "auto").
  R2_ENDPOINT: https://s3:443
  S3_REGION: us-east-1
  R2_BUCKET: dumpster-uploads
  R2_PUBLIC_BASE_URL: https://media.dumpster.local
  CORS_ORIGIN: https://dumpster.local
  METADATA_FETCH_ALLOWLIST: media.dumpster.local
  RUN_MIGRATIONS: 'true'
  # Frontend runtime URL overrides (replaces build-time defaults in start.sh)
  NEXT_PUBLIC_API_URL: https://api.dumpster.local
  NEXT_PUBLIC_WS_URL: wss://api.dumpster.local/ws
  NEXT_PUBLIC_RPC_URL: http://localhost:8899
  NEXT_PUBLIC_SITE_URL: https://dumpster.local

# Route every buildable container to its locally-built `:local` tag.
# These images are produced by `laconic-so build-containers` and must
# be loaded into the kind cluster via `kind load docker-image` before
# `deployment start` — they exist only in the local docker daemon.
image-overrides:
  dumpster-db: gorbagana-dev/dumpster-db:local
  dumpster-frontend: gorbagana-dev/dumpster-frontend:local
  dumpster-backend: gorbagana-dev/dumpster-backend:local
  dumpster-kubo: gorbagana-dev/dumpster-kubo:local
  dumpster-docs: gorbagana-dev/dumpster-docs:local
