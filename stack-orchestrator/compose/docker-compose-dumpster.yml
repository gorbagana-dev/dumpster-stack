services:
  dumpster-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dumpster}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-dumpster}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - dumpster-db-data:/var/lib/postgresql/data
    ports:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-dumpster}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  dumpster-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dumpster-redis-data:/data
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  dumpster-kubo:
    image: ipfs/kubo:v0.33.2
    restart: unless-stopped
    volumes:
      - dumpster-ipfs-data:/data/ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
    environment:
      IPFS_PATH: /data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  dumpster-backend:
    image: gorbagana-dev/dumpster-backend:local
    restart: unless-stopped
    depends_on:
      dumpster-db:
        condition: service_healthy
      dumpster-redis:
        condition: service_healthy
      dumpster-kubo:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3200}
      DATABASE_URL: ${DATABASE_URL:-postgresql://dumpster:password@dumpster-db:5432/dumpster}
      REDIS_URL: ${REDIS_URL:-redis://dumpster-redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change-me-generate-a-real-secret}
      RPC_URL: ${RPC_URL:-https://rpc.trashscan.io}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET:-dumpster-uploads}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      IPFS_API_URL: ${IPFS_API_URL:-http://dumpster-kubo:5001}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-http://dumpster-kubo:8080}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MIGRATION_KEYPAIR: ${MIGRATION_KEYPAIR:-}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      METADATA_FETCH_ALLOWLIST: ${METADATA_FETCH_ALLOWLIST:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CERC_SCRIPT_DEBUG: ${CERC_SCRIPT_DEBUG}
    ports:
      - "${BACKEND_HOST_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3200"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dumpster-frontend:
    image: gorbagana-dev/dumpster-frontend:local
    restart: unless-stopped
    depends_on:
      dumpster-backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3000}
      CERC_SCRIPT_DEBUG: ${CERC_SCRIPT_DEBUG}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dumpster-docs:
    image: gorbagana-dev/dumpster-docs:local
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${DOCS_PORT:-3100}
      CERC_SCRIPT_DEBUG: ${CERC_SCRIPT_DEBUG}
    ports:
      - "${DOCS_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  dumpster-db-data:
  dumpster-redis-data:
  dumpster-ipfs-data:
