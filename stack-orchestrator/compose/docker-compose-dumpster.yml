services:
  dumpster-db:
    image: ghcr.io/gorbagana-dev/dumpster-db:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dumpster}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-dumpster}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:-dumpster-pg-backups}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:-52c20c98f552c6af17369284bd9a78b2.r2.cloudflarestorage.com}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-auto}
    volumes:
      - dumpster-db-data:/var/lib/postgresql/data
    ports:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-dumpster}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  dumpster-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dumpster-redis-data:/data
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  dumpster-kubo:
    image: ghcr.io/gorbagana-dev/dumpster-kubo:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "8080:8080"
    environment:
      IPFS_PATH: /data/ipfs
      AWS_ACCESS_KEY_ID: ${R2_IPFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${R2_IPFS_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      CERC_SCRIPT_DEBUG: ${CERC_SCRIPT_DEBUG}
    # Inject S3 credentials (and optionally endpoint) into ipfs datastore
    # config before starting. go-ds-s3 reads from config file, not env vars.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -f "$$IPFS_PATH/repo.lock"
        if [ -n "$$AWS_ACCESS_KEY_ID" ] && [ -n "$$AWS_SECRET_ACCESS_KEY" ]; then
          ENDPOINT_SED=""
          if [ -n "$$S3_ENDPOINT" ]; then
            ENDPOINT_SED="s|\"regionEndpoint\": \"[^\"]*\"|\"regionEndpoint\": \"$$S3_ENDPOINT\"|"
          fi
          ipfs config --json Datastore.Spec.mounts "$$(
            ipfs config --json Datastore.Spec.mounts |
            sed "s|\"accessKey\": \"[^\"]*\"|\"accessKey\": \"$$AWS_ACCESS_KEY_ID\"|" |
            sed "s|\"secretKey\": \"[^\"]*\"|\"secretKey\": \"$$AWS_SECRET_ACCESS_KEY\"|" |
            if [ -n "$$ENDPOINT_SED" ]; then sed "$$ENDPOINT_SED"; else cat; fi
          )"
          echo "Injected S3 credentials into ipfs datastore config"
        fi
        # Disable DHT/swarm — kubo is a pure S3-backed gateway, not a
        # network participant. Blocks are served from R2, not fetched
        # from the IPFS network.
        ipfs config Routing.Type none
        ipfs config --json Swarm.DisableNatPortMap true
        # NoFetch: serve only blocks in our S3 datastore. Without this
        # the gateway hangs trying to resolve CIDs from the network
        # (which is disabled).
        ipfs config --json Gateway.NoFetch true
        # Disable GC entirely. go-ds-s3 implements Delete() — if GC
        # ever runs, it deletes blocks from R2. There's no recovery.
        ipfs config Datastore.GCPeriod 0s
        exec ipfs daemon --migrate
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dumpster-backend:
    image: ghcr.io/gorbagana-dev/dumpster-backend:latest
    restart: unless-stopped
    depends_on:
      dumpster-db:
        condition: service_healthy
      dumpster-redis:
        condition: service_healthy
      dumpster-kubo:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3200}
      DATABASE_URL: ${DATABASE_URL:-postgresql://dumpster:password@dumpster-db:5432/dumpster}
      REDIS_URL: ${REDIS_URL:-redis://dumpster-redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change-me-generate-a-real-secret}
      RPC_URL: ${RPC_URL:-https://rpc.trashscan.io}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET:-dumpster-uploads}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      IPFS_API_URL: ${IPFS_API_URL:-http://dumpster-kubo:5001}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-http://dumpster-kubo:8080}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MIGRATION_KEYPAIR: ${MIGRATION_KEYPAIR:-}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      METADATA_FETCH_ALLOWLIST: ${METADATA_FETCH_ALLOWLIST:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CERC_SCRIPT_DEBUG: ${CERC_SCRIPT_DEBUG}
    ports:
      - "${BACKEND_HOST_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3200"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dumpster-frontend:
    image: ghcr.io/gorbagana-dev/dumpster-frontend:latest
    restart: unless-stopped
    depends_on:
      dumpster-backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3000}
      CERC_SCRIPT_DEBUG: ${CERC_SCRIPT_DEBUG}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dumpster-docs:
    image: ghcr.io/gorbagana-dev/dumpster-docs:latest
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${DOCS_PORT:-3100}
      CERC_SCRIPT_DEBUG: ${CERC_SCRIPT_DEBUG}
    ports:
      - "${DOCS_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  dumpster-db-data:
  dumpster-redis-data:
