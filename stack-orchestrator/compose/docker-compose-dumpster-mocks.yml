services:
  dumpster-minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Configure mc alias before starting so healthcheck works
        mc alias set local https://localhost:443 \
          $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} --insecure

        # Start MinIO with TLS on port 443
        minio server /data --address ":443" --console-address ":9001" \
          --certs-dir /certs &
        MINIO_PID=$$!

        # Wait for MinIO, then create buckets
        until mc ready local --insecure 2>/dev/null; do sleep 1; done
        mc mb --ignore-existing local/dumpster-uploads --insecure
        mc mb --ignore-existing local/dumpster-ipfs --insecure
        mc anonymous set download local/dumpster-uploads --insecure
        echo "MinIO ready with TLS on :443"

        wait $$MINIO_PID
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dumpsterlocaldev2026minioadmkeys}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dumpsterlocaldev2026minioadmkeys}
    ports:
      - "443"
      - "9001"
    volumes:
      - minio-certs:/certs:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local", "--insecure"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  minio-certs:
