<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumpster - Maintenance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 2rem;
    }
    .logo {
      font-size: 3rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #888;
    }
    .status {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      display: inline-block;
      font-size: 0.875rem;
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">&#x1F5D1;</div>
    <h1>Dumpster is updating</h1>
    <p>We're deploying a new version. This usually takes less than a minute.</p>
    <div class="status">Maintenance in progress</div>
  </div>
</body>
</html>
